# Test configuration for pytest
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    basic: Basic import and package tests
    smoke: Smoke tests for help functionality
    integration: Integration tests with real data
    slow: Slow running tests
