name: jloh
channels:
  - conda-forge
  - bioconda
  - r
  - defaults
dependencies:
  - python=3.9
  - pip
  # Core Python packages
  - numpy>=1.20.0
  - pandas>=1.3.0
  - matplotlib>=3.3.0
  - seaborn>=0.11.0
  - scipy>=1.7.0
  - biopython>=1.78
  # Bioinformatics tools
  - pysam>=0.16.0
  - pybedtools>=0.8.0
  - bedtools>=2.30.0
  - samtools>=1.12
  - mummer>=3.23
  # R and R packages
  - r-base>=4.0
  - r-ggplot2
  - r-reshape2
  - r-hash
  - r-scales
  - r-png
  # Additional tools
  - pip:
    - pytest>=6.0
    - pytest-cov
